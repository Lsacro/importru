<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMPROTRU Corporate Solutions</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#ED1A37',
              'whatsapp-green': '#25D366',
              'background-light': '#f8f6f6',
              'background-dark': '#211113',
              'text-main': '#303130',
              'text-secondary': '#5E5F5F',
            },
            fontFamily: {
              display: ['Space Grotesk', 'sans-serif'],
            },
            borderRadius: {
              DEFAULT: '0.25rem',
              lg: '0.5rem',
              xl: '0.75rem',
              full: '9999px',
            },
            animation: {
              scroll: 'scroll 40s linear infinite',
              'fade-slide': 'fadeSlide 9s infinite',
            },
            keyframes: {
              scroll: {
                '0%': {
                  transform: 'translateX(0)',
                },
                '100%': {
                  transform: 'translateX(-50%)',
                },
              },
              fadeSlide: {
                '0%': {
                  opacity: '0',
                  transform: 'translateY(20px)',
                },
                '5%': {
                  opacity: '1',
                  transform: 'translateY(0)',
                },
                '33%': {
                  opacity: '1',
                  transform: 'translateY(0)',
                },
                '38%': {
                  opacity: '0',
                  transform: 'translateY(-20px)',
                },
                '100%': {
                  opacity: '0',
                  transform: 'translateY(-20px)',
                },
              },
            },
          },
        },
      };
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      #tab-datacenter:checked ~ .tab-nav-container nav label[for='tab-datacenter'],
      #tab-licensing:checked ~ .tab-nav-container nav label[for='tab-licensing'],
      #tab-virtualization:checked ~ .tab-nav-container nav label[for='tab-virtualization'],
      #tab-protection:checked ~ .tab-nav-container nav label[for='tab-protection'] {
        color: #ed1a37;
        border-bottom-width: 2px;
        border-bottom-color: #ed1a366c;
      }
      .mask-linear {
        mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
