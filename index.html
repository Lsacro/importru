<!doctype html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMPROTRU</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ED1A37",
                        "whatsapp-green": "#25D366",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211113",
                        "text-main": "#303130",
                        "text-secondary": "#5E5F5F",
                        "surface-light": "#ffffff",
                        "surface-dark": "#2d1b1e",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    animation: {
                        'scroll': 'scroll 40s linear infinite',
                        'fade-slide': 'fadeSlide 9s infinite',
                    },
                    keyframes: {
                        scroll: {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-50%)' },
                        },
                        fadeSlide: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '5%': { opacity: '1', transform: 'translateY(0)' },
                            '33%': { opacity: '1', transform: 'translateY(0)' },
                            '38%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '0', transform: 'translateY(-20px)' },
                        }
                    }
                },
            },
        }
    </script>
</head>

<body
    class="font-display bg-background-light dark:bg-background-dark text-text-main dark:text-gray-100 overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
